<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meme Kay Ma Defral La Sa CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Pancarte calée image par image sur le tableau du gars (00:04.6 -> 00:07.8) */
    #boardOverlay {
      position: fixed;
      width: 58vw;
      height: 55vw;
      left: 48%;
      top: 63%;
      transform: translate(-50%, -50%) rotate(-2.5deg) scale(0);
      opacity: 0;
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      border: 3px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 18px 35px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      pointer-events: none;
      z-index: 30;
    }
    #boardOverlay.track-board {
      animation: followHands 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes followHands {
      0% {
        opacity: 0;
        top: 72%;
        left: 46%;
        transform: translate(-50%, -50%) rotate(-10deg) scale(0.55);
      }
      14% {
        opacity: 1;
        top: 56%;
        left: 47%;
        transform: translate(-50%, -50%) rotate(-3deg) scale(0.96);
      }
      45% {
        opacity: 1;
        top: 63%;
        left: 48%;
        transform: translate(-50%, -50%) rotate(-2deg) scale(1.02);
      }
      75% {
        opacity: 1;
        top: 64%;
        left: 48.5%;
        transform: translate(-50%, -50%) rotate(-1.5deg) scale(1.03);
      }
      100% {
        opacity: 1;
        top: 64%;
        left: 48%;
        transform: translate(-50%, -50%) rotate(-2deg) scale(1.03);
      }
    }
  </style>
</head>
<body class="relative flex items-center justify-center">

  <!-- ÉCRAN DE CHARGEMENT DE LA VIDÉO DEPUIS LA GALERIE IPHONE -->
  <div id="setupScreen" class="fixed inset-0 z-50 bg-zinc-950 text-white flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-xl font-bold mb-2">Meme « Kay ma defral la sa cv 😭 »</h1>
    <p class="text-xs text-zinc-400 max-w-xs mb-6">
      Sélectionne la vidéo du gars qui tombe depuis ta galerie Photos iPhone, puis lance la lecture.
    </p>

    <label class="w-full max-w-xs py-4 px-5 rounded-2xl bg-emerald-500 text-black font-extrabold text-sm shadow-xl cursor-pointer active:scale-95 transition">
      🎬 Choisir la vidéo dans mes Photos
      <input type="file" accept="video/*" class="hidden" onchange="loadMemeVideo(this)" />
    </label>
  </div>

  <!-- LECTEUR VIDÉO PLEIN ÉCRAN -->
  <video id="memeVid" playsinline class="w-full h-full object-cover"></video>

  <!-- LE TABLEAU REMPLACÉ SUR SES MAINS -->
  <div id="boardOverlay">
    <p class="text-black font-black text-2xl sm:text-3xl leading-tight tracking-tight">
      kay ma defral la sa cv😭
    </p>
    <span class="mt-3 text-[11px] font-mono font-bold bg-black text-emerald-400 px-2.5 py-1 rounded">
      👉 marfall915.github.io
    </span>
  </div>

  <script>
    const vid = document.getElementById('memeVid');
    const board = document.getElementById('boardOverlay');

    function loadMemeVideo(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      vid.src = URL.createObjectURL(file);
      document.getElementById('setupScreen').classList.add('hidden');
      setTimeout(() => {
        vid.play();
      }, 600);
    }

    // Déclenche la pancarte pile à 00:04.55 quand il lève le tableau devant lui
    vid.addEventListener('timeupdate', () => {
      if (vid.currentTime >= 4.55) {
        board.classList.add('track-board');
      } else {
        board.classList.remove('track-board');
      }
    });

    // Relance au clic sur l'écran si tu veux refaire une prise
    document.body.addEventListener('click', () => {
      if (vid.src && vid.paused) {
        board.classList.remove('track-board');
        vid.currentTime = 0;
        vid.play();
      }
    });
  </script>
</body>
</html>
