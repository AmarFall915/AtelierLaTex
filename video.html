<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meme Kay Ma Defral La Sa CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Masque fondu dans le bleu du vrai tableau (entre ses mains, sans cacher ses doigts) */
    #boardOverlay {
      position: fixed;
      width: 48vw;
      height: 44vw;
      left: 47.5%;
      top: 57.5%;
      transform: translate(-50%, -50%) rotate(-3.2deg) scale(0.7);
      opacity: 0;
      /* Couleur exacte du ciel de la pancarte avec bords fondus invisibles */
      background: radial-gradient(
        ellipse at center,
        rgba(175, 207, 233, 0.98) 0%,
        rgba(138, 181, 218, 0.96) 48%,
        rgba(120, 168, 210, 0.75) 68%,
        rgba(120, 168, 210, 0) 100%
      );
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      pointer-events: none;
      z-index: 30;
    }

    #boardOverlay.track-board {
      animation: followRealBoard 3.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Suivi exact de la montée du tableau entre 00:04.6 et 00:07.6 */
    @keyframes followRealBoard {
      0% {
        opacity: 0;
        left: 46.5%;
        top: 66%;
        transform: translate(-50%, -50%) rotate(-6deg) scale(0.65);
      }
      18% {
        opacity: 1;
        left: 47%;
        top: 56.5%;
        transform: translate(-50%, -50%) rotate(-3.5deg) scale(0.95);
      }
      45% {
        opacity: 1;
        left: 47.5%;
        top: 57.5%;
        transform: translate(-50%, -50%) rotate(-3.2deg) scale(1);
      }
      75% {
        opacity: 1;
        left: 48%;
        top: 58%;
        transform: translate(-50%, -50%) rotate(-2.8deg) scale(1.02);
      }
      100% {
        opacity: 1;
        left: 47.5%;
        top: 57.8%;
        transform: translate(-50%, -50%) rotate(-3deg) scale(1.02);
      }
    }

    .board-text {
      color: #0f172a;
      font-weight: 900;
      font-size: clamp(1.35rem, 6.2vw, 1.85rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.65);
    }
  </style>
</head>
<body class="relative flex items-center justify-center">

  <!-- ÉCRAN DE DÉPART -->
  <div id="setupScreen" class="fixed inset-0 z-50 bg-zinc-950 text-white flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-xl font-bold mb-2">Rendu Réaliste (Fondu sur le tableau)</h1>
    <p class="text-xs text-zinc-400 max-w-xs mb-6">
      Les vrais bords du tableau et ses doigts restent visibles : seul le centre est remplacé par « kay ma defral la sa cv😭 ».
    </p>

    <label class="w-full max-w-xs py-4 px-5 rounded-2xl bg-emerald-500 text-black font-extrabold text-sm shadow-xl cursor-pointer active:scale-95 transition">
      🎬 Choisir la vidéo dans mes Photos
      <input type="file" accept="video/*" class="hidden" onchange="loadMemeVideo(this)" />
    </label>
  </div>

  <!-- VIDÉO PLEIN ÉCRAN -->
  <video id="memeVid" playsinline class="w-full h-full object-cover"></video>

  <!-- TEXTE FONDU DIRECTEMENT SUR SON TABLEAU BLEU -->
  <div id="boardOverlay">
    <p class="board-text">
      kay ma defral la<br>sa cv😭
    </p>
  </div>

  <script>
    const vid = document.getElementById('memeVid');
    const board = document.getElementById('boardOverlay');

    function loadMemeVideo(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      vid.src = URL.createObjectURL(file);
      document.getElementById('setupScreen').classList.add('hidden');
      setTimeout(() => {
        vid.play();
      }, 600);
    }

    vid.addEventListener('timeupdate', () => {
      if (vid.currentTime >= 4.62) {
        board.classList.add('track-board');
      } else {
        board.classList.remove('track-board');
      }
    });

    document.body.addEventListener('click', () => {
      if (vid.src && vid.paused) {
        board.classList.remove('track-board');
        vid.currentTime = 0;
        vid.play();
      }
    });
  </script>
</body>
</html>
